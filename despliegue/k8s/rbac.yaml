apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: orchestra-namespace
  name: csi-driver-token-creator
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"] 
  verbs: ["create"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csi-driver-token-binding
  namespace: orchestra-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: csi-driver-token-creator       
subjects:
- kind: ServiceAccount
  name: secrets-store-csi-driver       
  namespace: kube-system