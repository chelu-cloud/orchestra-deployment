name: EKS GitOps Deployment

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'despliegue/k8s/**' ] 
    
  repository_dispatch:
    types: [deploy-trigger]

permissions:
  id-token: write 
  contents: read

jobs:
  deploy-to-eks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::622370466117:role/github-actions-eks-role
          aws-region: eu-west-3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cluster_app --region eu-west-3

      - name: Inject Secret ARN
        env:
          DB_SECRET_ARN: ${{ secrets.AWS_DB_SECRET_ARN }}
        run: |
          sed -i "s|PLACEHOLDER_OBJECTNAME|$DB_SECRET_ARN|g" despliegue/k8s/secretProviderClass.yaml

      - name: Update Image Tag
        if: github.event_name == 'repository_dispatch'
        run: |
          cd despliegue/k8s
          
          APP_NAME=${{ github.event.client_payload.app_name }}
          NEW_TAG=${{ github.event.client_payload.image_tag }}
          
          ECR_URL="622370466117.dkr.ecr.eu-west-3.amazonaws.com/${APP_NAME}"
          
          kustomize edit set image $ECR_URL=$ECR_URL:$NEW_TAG

      - name: Kubectl apply
        run: |
          kubectl apply -k despliegue/k8s/